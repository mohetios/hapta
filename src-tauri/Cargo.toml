[package]
name = "hapta"
# Released version comes from package.json via tauri.conf.json
version = "0.0.0"
description = "Minimalist weekly planner with Jalali (Persian) calendar and RTL support."
authors = ["Ali Zemani <mehot1@gmail.com>"]
license = "GPL-3.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-notification = "2.7"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-store = "2.5"
tauri-plugin-window-state = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
