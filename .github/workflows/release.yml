name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux AppImage deb
          - os: windows-latest
            args: --win nsis

    steps:
      - uses: actions/checkout@v4

      # webpack 4 breaks on Node 17+ (OpenSSL 3)
      - uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: yarn

      - run: yarn install --frozen-lockfile --network-timeout 600000

      - run: yarn electron:build ${{ matrix.args }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: hapta-${{ runner.os }}
          path: |
            dist_electron/*.exe
            dist_electron/*.AppImage
            dist_electron/*.deb

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist_electron/*.exe
            dist_electron/*.AppImage
            dist_electron/*.deb
