name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux AppImage deb
          - os: windows-latest
            args: --win nsis

    steps:
      - uses: actions/checkout@v7

      # webpack 4 breaks on Node 17+ (OpenSSL 3)
      - uses: actions/setup-node@v7
        with:
          node-version: 16
          cache: yarn

      - run: yarn install --frozen-lockfile --network-timeout 600000

      - run: yarn electron:build ${{ matrix.args }} --publish never

      - uses: actions/upload-artifact@v7
        with:
          name: hapta-${{ runner.os }}
          path: |
            dist_electron/*.exe
            dist_electron/*.AppImage
            dist_electron/*.deb

  # v* tag -> versioned release; push to main -> rolling "nightly" pre-release
  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

      - if: github.ref == 'refs/heads/main'
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly dist/* --prerelease --target "$GITHUB_SHA" \
            --title "Nightly ($(date -u +%F) ${GITHUB_SHA::7})" \
            --notes "Automatic build of \`main\` at $GITHUB_SHA. Not a stable release."
